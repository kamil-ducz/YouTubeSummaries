@if (data) {
  <div class="max-w-4xl mx-auto my-6 p-6 bg-amber-50/50 rounded-xl border border-amber-200 shadow-sm">
    <div class="flex justify-between items-center mb-4">
      <h3 class="text-lg font-bold text-amber-900 flex items-center gap-2">
        📝 Notes from the video
      </h3>
      <button (click)="downloadNotesFile()" 
              class="px-4 py-1.5 bg-amber-600 text-white text-sm font-medium rounded-md hover:bg-amber-700 transition flex items-center gap-1 cursor-pointer">
        Download file
      </button>
    </div>
    
    <div [innerHTML]="data"
    class="prose max-w-none bg-white p-6 rounded-lg border border-amber-100 min-h-[200px] text-slate-700 leading-relaxed whitespace-pre-wrap">
      
    </div>
  </div>
}
